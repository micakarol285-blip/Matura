
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,system-ui);background:var(--color-background-primary,#fff);color:var(--color-text-primary,#111)}

/* NAV */
.nav{display:flex;overflow-x:auto;border-bottom:0.5px solid var(--color-border-tertiary,#e5e7eb);background:var(--color-background-primary,#fff);position:sticky;top:0;z-index:20;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:12px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:500;color:var(--color-text-secondary,#6b7280);border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.nav-btn.active{color:var(--color-text-primary,#111);border-bottom-color:var(--accent,#8b5cf6)}
.nav-btn .nav-icon{font-size:16px}
.nav-btn .nav-label{font-size:10px;letter-spacing:.5px;font-weight:600}

/* HEADER */
.subj-header{padding:16px 16px 12px;border-bottom:0.5px solid var(--color-border-tertiary,#e5e7eb)}
.subj-title{font-size:20px;font-weight:500;margin-bottom:2px}
.subj-sub{font-size:11px;color:var(--color-text-secondary,#6b7280);letter-spacing:1px;margin-bottom:10px}
.xbar{background:var(--color-border-tertiary,#e5e7eb);border-radius:100px;height:7px;overflow:hidden;margin-bottom:6px}
.xfill{height:100%;border-radius:100px;transition:width .4s}
.stats-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.stat-txt{font-size:12px;color:var(--color-text-secondary,#6b7280)}
.stat-xp{font-size:12px;font-weight:600}
.reset-btn{font-size:11px;padding:3px 10px;border-radius:100px;border:0.5px solid var(--color-border-secondary,#d1d5db);background:transparent;cursor:pointer;color:var(--color-text-secondary,#6b7280)}

/* FILTERS */
.filters{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap;border-bottom:0.5px solid var(--color-border-tertiary,#e5e7eb)}
.f-btn{font-size:12px;padding:4px 12px;border-radius:100px;border:0.5px solid var(--color-border-secondary,#d1d5db);background:var(--color-background-primary,#fff);color:var(--color-text-secondary,#6b7280);cursor:pointer}
.f-btn.active{background:var(--color-background-secondary,#f3f4f6);color:var(--color-text-primary,#111);border-color:var(--color-border-primary,#9ca3af);font-weight:500}

/* CHAPTERS */
.chapters{padding:10px 16px 80px}
.section-divider{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--color-text-tertiary,#9ca3af);margin:14px 0 8px;padding-bottom:5px;border-bottom:0.5px solid var(--color-border-tertiary,#e5e7eb)}
.ch-card{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary,#e5e7eb);border-radius:12px;overflow:hidden;margin-bottom:8px}
.ch-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
.ch-icon{font-size:13px;color:var(--color-text-secondary,#9ca3af);transition:transform .2s;flex-shrink:0}
.ch-card.open .ch-icon{transform:rotate(90deg)}
.ch-title{flex:1;font-size:13px;font-weight:500;color:var(--color-text-primary,#111)}
.ch-mini{width:44px;height:4px;background:var(--color-border-tertiary,#e5e7eb);border-radius:100px;overflow:hidden;flex-shrink:0}
.ch-mini-f{height:100%;border-radius:100px;transition:width .3s}
.ch-prog{font-size:11px;color:var(--color-text-secondary,#6b7280);white-space:nowrap}
.ch-body{display:none;padding:0 14px 8px;border-top:0.5px solid var(--color-border-tertiary,#e5e7eb)}
.ch-card.open .ch-body{display:block}
.ch-note{font-size:11px;color:var(--color-text-tertiary,#9ca3af);font-style:italic;padding:7px 0 3px}
.bonus-tag{font-size:10px;padding:2px 6px;border-radius:100px;background:#fef3c7;color:#92400e;font-weight:600;white-space:nowrap;flex-shrink:0}
.quest-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary,#e5e7eb);cursor:pointer}
.quest-row:last-child{border-bottom:none}
.cb{width:17px;height:17px;border-radius:4px;border:0.5px solid var(--color-border-secondary,#d1d5db);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.cb.done{color:#fff;font-size:10px}
.qt{font-size:12px;color:var(--color-text-primary,#111);line-height:1.5;flex:1}
.qt.done{color:var(--color-text-secondary,#9ca3af);text-decoration:line-through}
.qxp{font-size:10px;color:var(--color-text-tertiary,#9ca3af);white-space:nowrap;margin-top:2px}
.done-banner{display:none;background:#f0fdf4;border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px;font-weight:500}
.ch-card.all-done .done-banner{display:block}

/* TOAST */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:500;padding:8px 18px;border-radius:100px;pointer-events:none;white-space:nowrap;z-index:999;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>

// Load all states
const states = {};
SUBJECTS.forEach(s => {
  try { states[s.id] = JSON.parse(localStorage.getItem(s.storageKey)) || {}; }
  catch { states[s.id] = {}; }
});
function saveState(sid) {
  const subj = SUBJECTS.find(s=>s.id===sid);
  try { localStorage.setItem(subj.storageKey, JSON.stringify(states[sid])); } catch {}
}

let currentSubj = 'pl';
let currentFilter = 'all';
const openChapters = {};

function isDone(sid, chId, qi) { return !!((states[sid][chId]||{})[qi]); }
function toggleQuest(sid, chId, qi) {
  if(!states[sid][chId]) states[sid][chId]={};
  states[sid][chId][qi] = !states[sid][chId][qi];
  saveState(sid);
  renderContent();
  showToast();
}
function toggleChapter(chId) {
  openChapters[chId] = !openChapters[chId];
  renderContent();
}

const toastMsgs = ['Quest ukończony!','Dobra robota!','Odhaczone!','Idziesz do przodu!','XP zdobyte!'];
let toastTimer;
function showToast() {
  const t = document.getElementById('toast');
  t.textContent = toastMsgs[Math.floor(Math.random()*toastMsgs.length)];
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function subjStats(sid) {
  let done=0,total=0,xpDone=0,xpAll=0;
  const subj = SUBJECTS.find(s=>s.id===sid);
  subj.sections.forEach(sec=>sec.chapters.forEach(ch=>{
    ch.quests.forEach((_,i)=>{
      total++; xpAll+=ch.xp;
      if(isDone(sid,ch.id,i)){done++;xpDone+=ch.xp;}
    });
  }));
  return {done,total,xpDone,xpAll};
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = SUBJECTS.map(s=>{
    const {done,total} = subjStats(s.id);
    const pct = total?Math.round(done/total*100):0;
    return `<button class="nav-btn${currentSubj===s.id?' active':''}" onclick="switchSubj('${s.id}')" style="--accent:${s.color}">
      <span class="nav-icon">${s.icon}</span>
      <span class="nav-label">${s.label}</span>
      <span style="font-size:10px;color:${currentSubj===s.id?s.color:'var(--color-text-tertiary,#9ca3af)'}">${pct}%</span>
    </button>`;
  }).join('');
}

function renderContent() {
  const subj = SUBJECTS.find(s=>s.id===currentSubj);
  const {done,total,xpDone,xpAll} = subjStats(currentSubj);
  const pct = xpAll?Math.round(xpDone/xpAll*100):0;
  const c = subj.color;

  let html = `
    <div class="subj-header">
      <div class="subj-title" style="color:${c}">${subj.icon} ${subj.label === 'Mat. P' ? 'Matematyka Podstawowa' : subj.label === 'Mat. R' ? 'Matematyka Rozszerzona' : subj.label}</div>
      <div class="subj-sub">MATURA 2027 — FORMUŁA 2015</div>
      <div class="xbar"><div class="xfill" style="width:${pct}%;background:${c}"></div></div>
      <div class="stats-row">
        <span class="stat-txt">${done}/${total} questów</span>
        <span class="stat-xp" style="color:${c}">${xpDone}/${xpAll} XP</span>
        <button class="reset-btn" onclick="resetSubj('${subj.id}')">Resetuj</button>
      </div>
    </div>
    <div class="filters">
      ${[['all','Wszystkie'],['todo','Do zrobienia'],['done','Ukończone']].map(([v,l])=>
        `<button class="f-btn${currentFilter===v?' active':''}" onclick="setFilter('${v}')">${l}</button>`
      ).join('')}
    </div>
    <div class="chapters">`;

  subj.sections.forEach(sec=>{
    if(sec.title) html += `<div class="section-divider">${sec.title}</div>`;
    sec.chapters.forEach(ch=>{
      const chDone = ch.quests.filter((_,i)=>isDone(subj.id,ch.id,i)).length;
      const chAll = ch.quests.length;
      const allDone = chDone===chAll;
      if(currentFilter==='done' && !allDone) return;
      if(currentFilter==='todo' && allDone) return;
      const isOpen = !!openChapters[ch.id];
      const miniPct = Math.round(chDone/chAll*100);
      html += `<div class="ch-card${isOpen?' open':''}${allDone?' all-done':''}">
        <div class="ch-head" onclick="toggleChapter('${ch.id}')">
          <span class="ch-icon">▶</span>
          <span class="ch-title">${ch.name}</span>
          ${ch.bonus?'<span class="bonus-tag">BONUS IT</span>':''}
          <div class="ch-mini"><div class="ch-mini-f" style="width:${miniPct}%;background:${c}"></div></div>
          <span class="ch-prog">${chDone}/${chAll}</span>
        </div>`;
      if(isOpen){
        html += `<div class="ch-body">`;
        if(ch.note) html += `<div class="ch-note">💬 ${ch.note}</div>`;
        ch.quests.forEach((q,i)=>{
          const d = isDone(subj.id,ch.id,i);
          html += `<div class="quest-row" onclick="toggleQuest('${subj.id}','${ch.id}',${i})">
            <div class="cb${d?' done':''}" style="${d?'background:'+c+';border-color:'+c:''}">${d?'✓':''}</div>
            <div class="qt${d?' done':''}">${q}</div>
            <div class="qxp">+${ch.xp} XP</div>
          </div>`;
        });
        html += `<div class="done-banner" style="color:${c}">🏆 Dział ukończony!</div></div>`;
      }
      html += `</div>`;
    });
  });

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
  renderNav();
}

function switchSubj(sid) { currentSubj=sid; currentFilter='all'; renderContent(); }
function setFilter(f) { currentFilter=f; renderContent(); }
function resetSubj(sid) {
  if(confirm('Zresetować postęp z tego przedmiotu?')){ states[sid]={}; saveState(sid); renderContent(); }
}

renderNav();
renderContent();
</script>
</body>
</html>
